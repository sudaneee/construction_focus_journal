{% load static %}
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <i class="fas fa-building-columns sidebar-brand-icon"></i>
    <div class="sidebar-brand-text">
      <span class="sidebar-brand-name">CFJ</span>
      <span class="sidebar-brand-sub">Editorial Dashboard</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="sidebar-section-label">Overview</div>
    <a href="{% url 'src:dashboard' %}"
       class="sidebar-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
      <i class="fas fa-tachometer-alt sidebar-icon"></i>
      <span>Dashboard</span>
    </a>

    <div class="sidebar-section-label mt-3">Content</div>
    <a href="{% url 'src:volume_list' %}"
       class="sidebar-link {% if 'volume' in request.resolver_match.url_name %}active{% endif %}">
      <i class="fas fa-layer-group sidebar-icon"></i>
      <span>Volumes</span>
    </a>
    <a href="{% url 'src:issue_list' %}"
       class="sidebar-link {% if 'issue' in request.resolver_match.url_name %}active{% endif %}">
      <i class="fas fa-book-open sidebar-icon"></i>
      <span>Issues</span>
    </a>
    <a href="{% url 'src:article_list' %}"
       class="sidebar-link {% if 'article' in request.resolver_match.url_name %}active{% endif %}">
      <i class="fas fa-file-alt sidebar-icon"></i>
      <span>Articles</span>
    </a>
    <a href="{% url 'src:author_list' %}"
       class="sidebar-link {% if 'author' in request.resolver_match.url_name %}active{% endif %}">
      <i class="fas fa-users sidebar-icon"></i>
      <span>Authors</span>
    </a>
    <a href="{% url 'src:submission_list' %}"
       class="sidebar-link {% if 'submission' in request.resolver_match.url_name %}active{% endif %}">
      <i class="fas fa-inbox sidebar-icon"></i>
      <span>Submissions</span>
      {% if pending_submissions_count %}
      <span class="badge bg-danger ms-auto">{{ pending_submissions_count }}</span>
      {% endif %}
    </a>

    <div class="sidebar-section-label mt-3">Site Content</div>
    <a href="{% url 'src:announcement_list' %}"
       class="sidebar-link {% if 'announcement' in request.resolver_match.url_name %}active{% endif %}">
      <i class="fas fa-bullhorn sidebar-icon"></i>
      <span>Announcements</span>
    </a>
    <a href="{% url 'src:site_settings_edit' %}"
       class="sidebar-link {% if 'site_settings' in request.resolver_match.url_name %}active{% endif %}">
      <i class="fas fa-cog sidebar-icon"></i>
      <span>Site Settings</span>
    </a>
    <a href="{% url 'src:scope_topic_list' %}"
       class="sidebar-link {% if 'scope_topic' in request.resolver_match.url_name %}active{% endif %}">
      <i class="fas fa-tags sidebar-icon"></i>
      <span>Scope Topics</span>
    </a>
    <a href="{% url 'src:review_step_list' %}"
       class="sidebar-link {% if 'review_step' in request.resolver_match.url_name %}active{% endif %}">
      <i class="fas fa-tasks sidebar-icon"></i>
      <span>Review Steps</span>
    </a>
    <a href="{% url 'src:guideline_item_list' %}"
       class="sidebar-link {% if 'guideline' in request.resolver_match.url_name %}active{% endif %}">
      <i class="fas fa-list-check sidebar-icon"></i>
      <span>Guidelines</span>
    </a>

    <div class="sidebar-divider"></div>

    <a href="{% url 'website:home' %}" class="sidebar-link" target="_blank">
      <i class="fas fa-globe sidebar-icon"></i>
      <span>View Public Site</span>
      <i class="fas fa-external-link-alt sidebar-external ms-auto"></i>
    </a>
    <a href="{% url 'src:logout' %}" class="sidebar-link sidebar-logout">
      <i class="fas fa-sign-out-alt sidebar-icon"></i>
      <span>Logout</span>
    </a>
  </nav>
</aside>
