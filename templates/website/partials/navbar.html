{% load static %}
<nav class="navbar navbar-expand-lg navbar-dark sticky-top" id="mainNav">
  <div class="container">
    <a class="navbar-brand" href="{% url 'website:home' %}">
      <div class="brand-logo">
        {% if site_settings.logo %}
        <img src="{{ site_settings.logo.url }}" alt="{{ site_settings.site_name }}" class="brand-logo-img" width="42" height="42">
        {% else %}
        <i class="fas fa-building-columns brand-icon"></i>
        {% endif %}
        <div class="brand-text">
          <span class="brand-name">{{ site_settings.department }}</span>
          <span class="brand-subtitle">{{ site_settings.faculty }}</span>
          <span class="brand-subtitle">{{ site_settings.institution }}</span>
        </div>
      </div>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" id="mainMenuDropdown" role="button"
             data-bs-toggle="dropdown" aria-expanded="false">
            <i class="fas fa-bars me-1"></i> Menu
          </a>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="mainMenuDropdown">
            <li>
              <a class="dropdown-item {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
                 href="{% url 'website:home' %}">Home</a>
            </li>
            <li>
              <a class="dropdown-item {% if request.resolver_match.url_name == 'about' %}active{% endif %}"
                 href="{% url 'website:about' %}">About</a>
            </li>
            <li>
              <a class="dropdown-item {% if request.resolver_match.url_name == 'volumes' %}active{% endif %}"
                 href="{% url 'website:volumes' %}">Archives</a>
            </li>
            <li>
              <a class="dropdown-item {% if request.resolver_match.url_name == 'submit' %}active{% endif %}"
                 href="{% url 'website:submit' %}">Submit a Paper</a>
            </li>
            <li>
              <a class="dropdown-item {% if request.resolver_match.url_name == 'contact' %}active{% endif %}"
                 href="{% url 'website:contact' %}">Contact</a>
            </li>
          </ul>
        </li>
        <li class="nav-item ms-lg-2">
          <a class="nav-link nav-search-btn" href="{% url 'website:search' %}" title="Search">
            <i class="fas fa-search"></i>
            <span class="d-lg-none ms-1">Search</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
